name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - core
          - testing
          - both

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run tests
        run: yarn test:run

      - name: Configure npm auth
        run: yarn config set npmAuthToken ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/core
        if: ${{ inputs.package == 'core' || inputs.package == 'both' }}
        run: yarn workspace @semantic-lambda/core npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/testing
        if: ${{ inputs.package == 'testing' || inputs.package == 'both' }}
        run: yarn workspace @semantic-lambda/testing npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
