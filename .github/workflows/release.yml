name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_core:
        description: 'Publish @semantic-lambda/core'
        type: boolean
        default: false
      publish_testing:
        description: 'Publish @semantic-lambda/testing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run tests
        run: yarn test:run

      - name: Configure npm auth
        run: |
          yarn config set npmRegistryServer https://registry.npmjs.org
          yarn config set npmAuthToken ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/core
        if: contains(needs.release-please.outputs.paths_released, 'packages/core')
        run: yarn workspace @semantic-lambda/core npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/testing
        if: contains(needs.release-please.outputs.paths_released, 'packages/testing')
        run: yarn workspace @semantic-lambda/testing npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  manual-publish:
    name: Manual Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.publish_core || inputs.publish_testing)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run tests
        run: yarn test:run

      - name: Configure npm auth
        run: |
          yarn config set npmRegistryServer https://registry.npmjs.org
          yarn config set npmAuthToken ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/core
        if: inputs.publish_core
        run: yarn workspace @semantic-lambda/core npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @semantic-lambda/testing
        if: inputs.publish_testing
        run: yarn workspace @semantic-lambda/testing npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
